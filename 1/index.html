<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/2016/" />
    <link rel="canonical" href="/2016/" />
    <title>Redirecting…</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #08090d;
        color: #f5f7fb;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(156, 243, 255, 0.12), transparent 34%),
          radial-gradient(circle at bottom right, rgba(255, 141, 107, 0.1), transparent 30%),
          linear-gradient(180deg, #07070a 0%, #090b12 100%);
      }

      .redirect-card {
        padding: 1rem 1.2rem;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(32, 34, 40, 0.68);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      .redirect-card p {
        margin: 0 0 0.35rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.72);
      }

      .redirect-card a {
        color: #fff;
        text-decoration: none;
      }
    </style>
    <script>
      window.location.replace("/2016/");
    </script>
  </head>
  <body>
    <div class="redirect-card">
      <p>Redirecting</p>
      <a href="/2016/">Continue to /2016</a>
    </div>
  </body>
  </html>
